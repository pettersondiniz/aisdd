[fallback]
model = "inherit"
reasoning_effort = "inherit"

[aliases]
tester = "test-engineer"

[tiers.economy]
model_patterns = ["(?i)(?:^|-)5\\.6-luna$", "(?i)(?:^|-)5\\.4-mini$"]
effort_order = ["low", "medium", "high", "xhigh", "max"]

[tiers.standard]
model_patterns = ["(?i)(?:^|-)5\\.6-terra$", "(?i)(?:^|-)5\\.4$"]
effort_order = ["medium", "high", "low", "xhigh", "max", "ultra"]

[tiers.robust]
model_patterns = ["(?i)(?:^|-)5\\.6-terra$", "(?i)(?:^|-)5\\.4$", "(?i)(?:^|-)5\\.6-sol$"]
effort_order = ["high", "max", "medium", "xhigh", "ultra", "low"]

[roles.explorer]
model = "gpt-5.6-luna"
reasoning_effort = "low"
tier = "economy"

[roles.planner]
model = "gpt-5.6-terra"
reasoning_effort = "medium"
tier = "standard"

[roles.planner.by_class.T2]
model = "gpt-5.6-terra"
reasoning_effort = "high"
tier = "robust"

[roles.planner.by_class.T3]
model = "gpt-5.6-terra"
reasoning_effort = "high"
tier = "robust"

[roles.planner.by_class.T4]
model = "gpt-5.6-terra"
reasoning_effort = "max"
tier = "robust"

[roles.implementer]
