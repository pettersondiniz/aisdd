# Model preferences for AISDD. If gpt-6-luna is unavailable, inherit the
# compatible runtime model; model routing does not select a subagent protocol.

[defaults]
model = "gpt-6-luna"
effort = "inherit"

[roles.planner]
model = "gpt-6-luna"
effort = "medium"

[roles.planner.by_risk.low]
effort = "low"

[roles.planner.by_risk.medium]
effort = "medium"

[roles.planner.by_risk.high]
effort = "high"

[roles.implementer]
model = "gpt-6-luna"
effort = "high"

[roles.implementer.by_risk.low]
effort = "medium"

[roles.implementer.by_risk.medium]
effort = "high"

[roles.implementer.by_risk.high]
effort = "xhigh"

[roles.tester]
model = "gpt-6-luna"
effort = "medium"

[roles.tester.by_risk.low]
effort = "low"

[roles.tester.by_risk.medium]
effort = "medium"

[roles.tester.by_risk.high]
effort = "high"

[roles.reviewer]
model = "gpt-6-luna"
effort = "high"

[roles.reviewer.by_risk.low]
effort = "medium"

[roles.reviewer.by_risk.medium]
effort = "high"

[roles.reviewer.by_risk.high]
effort = "xhigh"
